<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compstible" content="IE=edge">
    <title>Ejercicio 32</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="images/png" href="images/favicon.png">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!--Día 32, Nivel 1 Realizamos una sección para cambiar el color del fondo y el texto mediante Java-->
    <section class="content-section">
        <h1>DÍA 32</h1>
        <h2>NIVEL 1</h2>
        <h3>Ejercicio 1.1</h3>
        <!--Realizamos un p con un id y un botón con id para llamar a cada elemento mediante Java-->
        <p id="texto">Vamos a cambiar el texto de color mediante un botón en Javascript</p>
        <button id="alternarBoton">Alternar Color</button>
    </section>

    <!--Nivel 1, realizamos un div con id contenedor y un botón con onclick para cambiar el ancho del div-->
    <section class="content-section">
        <h3>Ejercicio 1.2</h3>
        <div id="contenedor">
            UN DIV MUUU BONITO
        </div>
        <button onclick="alternarAncho()">
            Alternar Ancho
        </button>
    </section>

    <!--Nivel 2, mediante un div en forma de cuadrado con id y class cuadrado cambiaremos el tamaño y la rotación del mismo mediante un btón con animación-->
    <section class="content-section">
        <h2>NIVEL 2</h2>
        <h3>Ejercicio 2.1</h3>
        <div id="miCuadrado" class="cuadrado"></div>
        <button onclick="alternarAnimacion()">Alternar</button>
    </section>

    <!--Nivel 2, mediante un div con id mi div que contiene un p y botón, haremos que con onclick en el btón el div se esconda-->
    <section class="content-section">
        <h3>Ejercicio 2.2</h3>
        <div id="miDiv">
            <p>Holaa ¿Vámos a ver si esto se esconde, no?
            </p>
        </div>
        <button onclick="alternarVisibilidad()">Visibilidad</button>
    </section>

    <!--Nivel 2, mediante un div con clase contenedor que contiene un p y botón, con clase e id texto además de un onclick haremos que el texto cambie su opacidad dejandosé de ver-->
    <section class="content-section">
        <h3>Ejercicio 2.3</h3>
        <div class="contenedor">
            <p class="texto" id="miTexto">Opacidad</p>
            <button onclick="alternarOpacidad()">Alternar</button>
        </div>
    </section>

        <!--Nivel 3, mediante un div que contiene una serie de celdas enumeradas y un botón con un onclick, mediante una animación cambiará el color de las celdas de manera aleatoria-->
       <!--Además de que las veces que le demos la celda volverá a su color original y otra cambiará de color-->
        <section class="content-section">
        <h2>NIVEL 3</h2>
        <h3>Ejercicio 3.1 y 3.2</h3>
        <div class="contenedor-celdas">
            <div class="celda" id="celda-1">1</div>
            <div class="celda" id="celda-2">2</div>
            <div class="celda" id="celda-3">3</div>
            <div class="celda" id="celda-4">4</div>
            <div class="celda" id="celda-5">5</div>
            <div class="celda" id="celda-6">6</div>
            <div class="celda" id="celda-7">7</div>
            <div class="celda" id="celda-8">8</div>
            <div class="celda" id="celda-9">9</div>
            <button onclick="cambiarColorAleatorio()">Cambiar Color</button>
        </div>
    </section>

        <!-- NIVEL 3, EL ÚLTIMO EJERCICIO NO ME SALE D':< -->
</body>

</html>
