<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKE NOTICE</title>
    <link rel="stylesheet" href="imagenes/Logo_NIKE.svg.png" type="imagenlogo">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <ul class="header__ul">
                <div class="header__div">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="noticias.html">Noticias</a></li>
                    <li><a href="login.html">Registrate</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </div>
            </ul>
        </nav>
        <form action="/search" class="header__form" method="get" id="search-form">
            <fieldset class="header__buscador">
                <input class="input__buscador" type="text" id="search-input" name="q" placeholder="Buscar...">
                <input class="input__button" type="submit" type="submit" value="Buscar">
            </fieldset>
        </form>

        <section class="header__texto">
            <h1>NOTICIAS NIKE</h1>
            <h2>Las noticias más relevantes del mundo Nike</h2>
        </section>
        <div class="header__wave" style="height: 150px; overflow: hidden;"><svg viewBox="0 0 500 150"
                preserveAspectRatio="none" style="height: 100%; width: 100%;">
                <path d="M0.00,49.98 C149.99,150.00 349.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z"
                    style="stroke: none; fill: rgb(255, 255, 255);"></path>
            </svg></div>
    </header>


    <main>
        <section class="contenedor main__section">
            <div class="contenedor-main__section">
                <img class="main__img" src="imagenes/zapa png.webp" alt="zapatilla nike">
                <div class="main__texto">
                    <h3 class="main__uno"><span></span>Noticias Recientes</h3>
                    <h3 class="main__uno"><span></span>Mantete actualizado</h3>
                </div>
            </div>
        </section>

        <section class="main__section--dos">
            <div class="contenedor main__noticias">
                <h2 class="titulo">
                    <div class="main__galeria">
                        <picture>
                            <img src="imagenes/1.webp" alt="airjordan">
                        </picture>
                        <div class="hover__galeria">
                            <h2 class="titulo">AirJordan</h2>
                        </div>
                    </div>

                    <div class="main__galeria">
                        <picture>
                            <img src="imagenes/exposicion.jpeg" alt="exposicion">
                        </picture>
                        <div class="hover__galeria">
                            <h2 class="titulo">AirJordan</h2>
                        </div>
                    </div>

                    <div class="main__galeria">
                        <picture>
                            <img src="imagenes/cama.webp" alt="mind">
                        </picture>
                        <div class="hover__galeria">
                            <h2 class="titulo">AirJordan</h2>
                        </div>
                    </div>

                    <div class="main__galeria">
                        <picture>
                            <img src="imagenes/alcaraz.jpg" alt="alcaraz">
                        </picture>
                        <div class="hover__galeria">
                            <h2 class="titulo">AirJordan</h2>
                        </div>
                    </div>
                </h2>
            </div>
        </section>
    </main>


    <footer>
        <div class="contenedor footer__div">
            <li class="footer__li">
                <h4 class="footer__phone">
                    <a href="https://www.nike.com/es/help">
                        Teléfono</a>
                </h4>
                <h4 class="footer__email">
                    <a href="https://www.nike.com/es/help">
                        Email</a>
                </h4>
                <h4 class="footer__social">
                    <a href="https://www.instagram.com/nike/">
                        Redes Sociales</a>
                </h4>
            </li>
        </div>
    </footer>

</body>

</html>
