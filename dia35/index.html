<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compstible" content="IE=edge">
    <title>Ejercicio 35</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="images/png" href="images/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/main.js" defer></script>

</head>

<body>
    <h1 class="titulo">Nivel 1</h1>
    <section class="swiper">
        <h2>SLIDER LIBRERÍA</h2>
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/1.jpg" alt="Zapatillas mini"></div>
            <div class="swiper-slide"><img src="images/2.jpeg" alt="Zapatillas mini"></div>
            <div class="swiper-slide"><img src="images/3.jpeg" alt="Zapatillas mini"></div>
            <div class="swiper-slide"><img src="images/4.jpeg" alt="Zapatillas mini"></div>
        </div>

        <div class="swiper-pagination"></div>


        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>


        <div class="swiper-scrollbar"></div>
    </section>

    <section class="slider-container">
        <h2>SLIDER PROPIO</h2>
        <div class="slider">
            <img src="images/1.jpg" alt="Zapatillas mini">
            <img src="images/2.jpeg" alt="Zapatillas mini">
            <img src="images/3.jpeg" alt="Zapatillas mini">
            <img src="images/4.jpeg" alt="Zapatillas mini">
        </div>
        <button class="nav-btn prev" onclick="prevSlide()">&#10094; Anterior</button>
        <button class="nav-btn next" onclick="nextSlide()">Siguiente &#10095;</button>
    </section>

    <h3 class="titulo">Nivel 2</h3>
    <section class="slider-contenedor">
        <div class="sliderdos">
            <span style="--i:1;">
                <img src="images/1.jpg" alt="Zapatillas mini">
            </span>
            <span style="--i:2;">
                <img src="images/2.jpeg" alt="Zapatillas mini">
            </span>
            <span style="--i:3;">
                <img src="images/3.jpeg" alt="Zapatillas mini">
            </span>
            <span style="--i:4;">
                <img src="images/4.jpeg" alt="Zapatillas mini">
            </span>
        </div>
    </section>

</body>

</html>
